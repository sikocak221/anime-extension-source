name: Smoke test

# Once a day, every extension runs its whole reading flow (popular → search → details → episodes → streams, with the
# app's checks). A broken one gets an issue (or a comment on its open issue) that links the run; the log stays in the run. A timeout, a 403 or a
# rate limit is not always the extension's fault: look before changing code.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test every extension against its site
        id: smoke
        run: |
          failed=""
          for dir in src/*/*/; do
            id=$(basename "$dir")
            echo "::group::$id"
            if ! (cd "$dir" && timeout 300 pnpm exec ma-ext test . 2>&1) | tee "smoke-$id.log"; then failed="$failed $id"; fi
            echo "::endgroup::"
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
        shell: bash -o pipefail {0}
      - name: Report broken extensions
        if: steps.smoke.outputs.failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.smoke.outputs.failed }}
        run: |
          for id in $FAILED; do
            title="Smoke test failing: $id"
            body=$(printf 'The daily smoke test of `%s` failed on %s. See the [run](%s) for the log.\n' \
              "$id" "$(date -u +%F)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done
          exit 1
